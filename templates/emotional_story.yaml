# 情绪故事模板 — 适用于人物叙述、情绪表达、品牌故事类视频

meta:
  name: "emotional_story"
  description: "适用于人物故事、情绪表达、治愈氛围和品牌感叙事类短视频"
  version: "1.1"
  author: "AI_clip"
  is_default: false
  tags: ["情绪", "故事", "人物", "治愈", "叙事"]

extends: _global

canvas:
  width: 1080
  height: 1920
  fps: 30

timeline:
  intro:
    type: title_card
    duration: 1.2
    background: "#17111b"
    text: "{{ headline }}"
    text_style:
      font_size: 58
      color: "#F1D8FF"
      bold: true
      alignment: center
      margin_h: 120
      max_chars_per_line: 14
      max_lines: 2
      animation: fade_up

  body:
    type: media_sequence
    source: "$input_media"
    duration: auto
    fit_mode: cover_center
    transition:
      type: dissolve
      duration: 0.7

  outro:
    type: title_card
    duration: 1.8
    text: "{{ cta }}"
    text_style:
      font_size: 44
      color: "#FFFFFF"
      alignment: center
      margin_h: 120
      animation: fade

audio:
  voice:
    engine: edge-tts
    voice_id: zh-CN-XiaoyiNeural
    rate: "-6%"
    volume: 1.0
  bgm:
    file: "assets/bgm/upbeat_01.mp3"
    volume: 0.14
    ducking:
      enabled: true
      target_volume: 0.05
      fade_duration: 0.45

subtitles:
  source: tts_srt

  safe_area:
    bottom: 500
    right: 120
    left: 120

  style:
    font: "Microsoft YaHei"
    font_size: 44
    color: "#FFFFFF"
    bold: false
    spacing: 1.5
    alignment: 2
    margin_v: 500
    margin_h: 120
    max_chars_per_line: 17
    max_lines: 3
    outline:
      color: "#151018"
      width: 2
    shadow: 2
    fade_in: 220
    fade_out: 140

    background:
      enabled: true
      color: "#000000"
      opacity: 0.42
      border_radius: 12
      padding_h: 24
      padding_v: 10
      blur: 5

  timing:
    chars_per_second_unit: 12
    unit_seconds: 1.0
    min_seconds: 1.2
    padding_seconds: 0.35

title:
  enabled: true
  style:
    font: "Microsoft YaHei"
    font_size: 58
    color: "#FFFFFF"
    bold: true
    alignment: 8
    margin_v: 200
    margin_h: 120
    max_chars_per_line: 14
    max_lines: 2
    spacing: 2.0
    outline_color: "#000000"
    outline_width: 3
    shadow: 2
    fade_in: 500
    fade_out: 500

effects:
  color_grade: warm_boost
  vignette: 0.22
  slowdown: 0.84
  ken_burns:
    enabled: true
    zoom_range: 0.1
    drift_speed: 0.14

editing:
  techniques:
    - name: cinematic
      description: "优先慢放、漂移和柔和转场，突出情绪递进"
    - name: trim_fade
      description: "保留最有情绪张力的片段"
    - name: speed_adjust
      description: "在不破坏叙事氛围的前提下微调时长"

copy:
  variables:
    - name: story_theme
      required: false
      default: "成长"
      description: "故事主题，如“成长”“告别”“重逢”"
    - name: protagonist
      required: false
      default: "她"
      description: "故事主角，如“她”“他”“那个女孩”"
    - name: emotion_keyword
      required: false
      default: "慢慢和自己和解"
      description: "情绪关键词"
    - name: audience
      required: false
      default: ""
      description: "想对谁说，如“正在努力的人”“最近失眠的你”"

  script_template: |
    {{ opening }}
    关于{{ story_theme }}，其实一直都想说一段话。
    很多时候，{{ protagonist }}真正经历的，不只是表面的变化，而是{{ emotion_keyword }}。
    {% if audience %}如果你刚好是{{ audience }}，希望这段内容也能给你一点点力量。{% endif %}
    {{ cta }}

  title_template: "{{ headline }}\n{{ hashtag }}"

  presets:
    headline:
      - "这段话送给最近的你"
      - "有些感受，终于能说出来了"
      - "关于成长，我想慢慢讲给你听"
      - "看似平静，其实心里早有波澜"
      - "希望你也能被这段话轻轻接住"
    hashtag:
      - "#情绪表达 #故事感 #治愈片段"
      - "#人物故事 #情绪短片 #慢一点也没关系"
      - "#走心文案 #治愈内容 #故事分享"
      - "#情绪价值 #生活感悟 #温柔表达"
    opening:
      - "有些内容不需要特别大的情节推进，只要一句话、一个眼神、一个停顿，就已经足够打动人。"
      - "成长这件事，很多时候不是突然变得勇敢，而是在一次次沉默之后，慢慢学会理解自己。"
      - "我们总以为情绪会自己过去，可真正重要的，是有人愿意认真看见你经历了什么。"
      - "很多瞬间表面上看起来风平浪静，但真正经历的人，心里其实早就翻涌过很多次。"
      - "如果你最近也有点累，希望这段话不会显得太重，反而能让你稍微放松一点。"
    cta:
      - "如果你也有类似感受，评论区聊聊吧。"
      - "把这段内容留给正在需要一点安慰的人。"
      - "如果这句话刚好说到你心里，记得点个赞。"
      - "关注我，继续听更多温柔一点的故事。"

match_rules:
  filename_contains: ["情感", "故事", "人物", "治愈", "情绪", "story", "emotion", "healing", "vlog"]
  folder_name: ["emotion", "story", "情感", "故事", "人物"]
  aspect_ratio: portrait
  min_duration: 5
  max_duration: 240
  priority: 8
