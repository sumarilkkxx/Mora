# 教程讲解模板 — 适用于步骤拆解、知识讲解、技巧分享类视频

meta:
  name: "tutorial"
  description: "适用于知识讲解、步骤拆解、经验分享和教学演示类短视频"
  version: "1.1"
  author: "AI_clip"
  is_default: false
  tags: ["教程", "知识", "讲解", "技巧", "干货"]

extends: _global

canvas:
  width: 1080
  height: 1920
  fps: 30

timeline:
  intro:
    type: title_card
    duration: 1.0
    background: "#101826"
    text: "{{ headline }}"
    text_style:
      font_size: 60
      color: "#D8F1FF"
      bold: true
      alignment: center
      margin_h: 120
      max_chars_per_line: 14
      max_lines: 2
      animation: fade_up

  body:
    type: media_sequence
    source: "$input_media"
    duration: auto
    fit_mode: cover_center
    transition:
      type: fade
      duration: 0.3

  outro:
    type: title_card
    duration: 1.4
    text: "{{ cta }}"
    text_style:
      font_size: 42
      color: "#FFFFFF"
      alignment: center
      margin_h: 120
      animation: fade

audio:
  voice:
    engine: edge-tts
    voice_id: zh-CN-YunxiNeural
    rate: "+0%"
    volume: 1.0
  bgm:
    file: "assets/bgm/upbeat_01.mp3"
    volume: 0.12
    ducking:
      enabled: true
      target_volume: 0.03
      fade_duration: 0.3

subtitles:
  source: tts_srt

  safe_area:
    bottom: 470
    right: 120
    left: 120

  style:
    font: "Microsoft YaHei"
    font_size: 42
    color: "#FFFFFF"
    bold: false
    spacing: 1.2
    alignment: 2
    margin_v: 470
    margin_h: 120
    max_chars_per_line: 18
    max_lines: 3
    outline:
      color: "#101826"
      width: 2
    shadow: 2
    fade_in: 160
    fade_out: 100

    background:
      enabled: true
      color: "#000000"
      opacity: 0.38
      border_radius: 10
      padding_h: 22
      padding_v: 10
      blur: 3

  timing:
    chars_per_second_unit: 12
    unit_seconds: 1.0
    min_seconds: 1.0
    padding_seconds: 0.25

title:
  enabled: true
  style:
    font: "Microsoft YaHei"
    font_size: 60
    color: "#FFFFFF"
    bold: true
    alignment: 8
    margin_v: 170
    margin_h: 120
    max_chars_per_line: 14
    max_lines: 2
    spacing: 1.8
    outline_color: "#000000"
    outline_width: 3
    shadow: 2
    fade_in: 360
    fade_out: 360

effects:
  color_grade: none
  vignette: 0.04
  slowdown: 1.0
  ken_burns:
    enabled: false

editing:
  techniques:
    - name: speed_adjust
      description: "优先保证口播和步骤信息清晰可跟上"
    - name: trim_fade
      description: "删除冗余片段，保留核心步骤"
    - name: cinematic
      description: "仅在素材节奏合适时轻微使用，避免影响教学清晰度"

copy:
  variables:
    - name: topic
      required: true
      default: ""
      description: "教程主题，如“拍照构图”“短视频开场写法”"
    - name: target_result
      required: false
      default: "更快上手"
      description: "可直接填写完整结果短语，如“更快上手”“拍出更干净的画面”"
    - name: step_summary
      required: false
      default: "记住这几个关键点就够了"
      description: "步骤概要"
    - name: target_user
      required: false
      default: ""
      description: "适用对象，如“新手”“刚入门的朋友”"

  script_template: |
    {{ opening }}
    今天这条内容，想和你聊的是{{ topic }}。
    整体其实不复杂，核心就是{{ step_summary }}，这样做会帮助你{{ target_result }}。
    {% if target_user %}如果你是{{ target_user }}，这条内容尤其适合先看一遍再实操。{% endif %}
    {{ cta }}

  title_template: "{{ topic }} · {{ headline }}\n{{ hashtag }}"

  presets:
    headline:
      - "这几个步骤记住就够了"
      - "一分钟讲清楚这个方法"
      - "新手也能快速上手"
      - "这条干货建议先收藏"
      - "手把手带你理顺思路"
    hashtag:
      - "#教程分享 #干货内容 #知识讲解"
      - "#实用技巧 #新手入门 #一分钟干货"
      - "#知识分享 #教程拆解 #提升效率"
      - "#技巧教学 #内容干货 #实操经验"
    opening:
      - "很多人一开始不是学不会，而是信息太杂，不知道应该先抓哪一步。"
      - "如果你最近刚好在卡这个问题，那这条内容可以帮你快速理一遍思路。"
      - "我尽量把复杂的内容讲简单一点，让你看完之后就知道先做什么、后做什么。"
      - "这类问题最怕一上来就记一堆细节，反而把真正重要的点忽略了。"
      - "今天不讲太绕的理论，直接把更实用、更容易落地的部分整理给你。"
    cta:
      - "如果你觉得有用，先收藏起来，后面照着做。"
      - "下期想看哪个主题，评论区告诉我。"
      - "关注我，继续拆更多实用技巧。"
      - "如果你已经在实操，欢迎评论区交流一下。"

match_rules:
  filename_contains: ["教程", "教学", "讲解", "步骤", "技巧", "干货", "tutorial", "howto", "tips", "guide"]
  folder_name: ["tutorial", "教程", "教学", "技巧", "guide"]
  aspect_ratio: portrait
  min_duration: 5
  max_duration: 180
  priority: 10
