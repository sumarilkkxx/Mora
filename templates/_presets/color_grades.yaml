# 调色预设

warm_boost:
  description: "暖色调增强"
  filter: "colortemperature=temperature=6800,eq=saturation=1.2:brightness=0.02"

cool_tone:
  description: "冷色调"
  filter: "colortemperature=temperature=5200,eq=saturation=1.1"

vintage:
  description: "复古胶片"
  filter: "curves=vintage,eq=saturation=0.8:brightness=-0.03"

high_contrast:
  description: "高对比度"
  filter: "eq=contrast=1.3:brightness=0.01:saturation=1.15"

none:
  description: "无调色"
  filter: ""
