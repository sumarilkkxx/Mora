# 理发店推荐模板 — 面向女性顾客的发型推荐、造型展示类视频

meta:
  name: "barbershop"
  description: "面向女性顾客的理发店推荐、发型展示、造型变化类短视频"
  version: "1.1"
  author: "AI_clip"
  is_default: true
  tags: ["理发店", "发型", "造型", "美发", "女性"]

extends: _global

canvas:
  width: 1080
  height: 1920
  fps: 30

timeline:
  intro:
    type: title_card
    duration: 0.8
    background: "#1a1a1a"
    text: "{{ headline }}"
    text_style:
      font_size: 68              # 标题文字 64-72px，取中间值
      color: "#F5DEB3"
      bold: true
      alignment: center
      margin_h: 120              # 水平安全边距，避开右侧互动按钮
      max_chars_per_line: 14     # 标题每行最多 14 字
      max_lines: 2
      animation: fade_up

  body:
    type: media_sequence
    source: "$input_media"
    duration: auto
    fit_mode: cover_center
    transition:
      type: fade
      duration: 0.5

  outro:
    type: title_card
    duration: 1.5
    text: "{{ cta }}"
    text_style:
      font_size: 48
      color: "#FFFFFF"
      alignment: center
      margin_h: 120              # 水平安全边距，避开右侧互动按钮
      animation: fade

audio:
  voice:
    engine: edge-tts
    voice_id: zh-CN-XiaoxiaoNeural
    rate: "-8%"
    volume: 1.0
  bgm:
    file: "assets/bgm/upbeat_01.mp3"
    volume: 0.4
    ducking:
      enabled: true
      target_volume: 0.15
      fade_duration: 0.3

subtitles:
  source: tts_srt

  # ── 安全区域（参考抖音 UI 布局图） ──
  safe_area:
    bottom: 480          # 底部 480px 保留给点赞/评论/分享 + 文字描述区
    right: 120           # 右侧 120px 保留给互动按钮列
    left: 120            # 左侧对称留白，保证文字水平居中

  # ── 旁白字幕样式 ──
  style:
    font: "Microsoft YaHei"
    font_size: 48              # 旁白字幕 44-52px（取中间值）
    color: "#FFFFFF"
    bold: false                # 旁白字幕用常规字重
    spacing: 1.5
    alignment: 2               # 底部水平居中
    margin_v: 480              # 底部安全距离：避开 UI 点赞/评论/分享/描述区
    margin_h: 120              # 水平安全边距：避开右侧互动按钮列，左右对称居中
    max_chars_per_line: 18     # 每行最多 18 个字符
    max_lines: 3               # 最多显示 3 行
    outline:
      color: "#1a1a1a"
      width: 2
    shadow: 2
    fade_in: 220
    fade_out: 120

    # 半透明黑色圆角背景底条
    background:
      enabled: true
      color: "#000000"
      opacity: 0.45            # 透明度 0.4-0.5，取中间值
      border_radius: 12        # 圆角半径
      padding_h: 24            # 水平内边距
      padding_v: 10            # 垂直内边距
      blur: 5                  # 底条边缘模糊半径（磨砂质感）

  # ── 字幕停留时长规则 ──
  # 最短停留时间 = ceil(字符数 / chars_per_second_unit) × unit_seconds
  # 例：30 字符 → ceil(30/13) × 1.0 = 3.0 秒；13 字符 → 1.0 秒
  timing:
    chars_per_second_unit: 13  # 每 13 个字符对应 1 秒最短展示时间
    unit_seconds: 1.0
    min_seconds: 1.0           # 单条字幕绝对最短时长
    padding_seconds: 0.3       # 额外留白，给观众反应时间

# ── 标题覆盖层（全时段显示在视频上方） ──
title:
  enabled: true
  style:
    font: "Microsoft YaHei"
    font_size: 68              # 标题 64-72px，取中间值
    color: "#FFFFFF"
    bold: true
    alignment: 8               # ASS top-center
    margin_v: 200              # 距顶部 200px（避开 140px 状态栏 + 头像区）
    margin_h: 120              # 水平安全边距
    max_chars_per_line: 14     # 每行最多 14 字
    max_lines: 2               # 最多 2 行
    spacing: 2.0
    outline_color: "#000000"
    outline_width: 3
    shadow: 2
    fade_in: 500
    fade_out: 500

effects:
  color_grade: high_contrast
  vignette: 0.2
  slowdown: 0.8
  ken_burns:
    enabled: true
    zoom_range: 0.12
    drift_speed: 0.20

editing:
  techniques:
    - name: cinematic
      description: "慢放 + 运镜漂移 + 淡入淡出转场（默认首选）"
    - name: speed_adjust
      description: "微调播放速度使素材恰好填满文案时长（0.75x~1.5x）"
    - name: trim_fade
      description: "素材过长时裁剪尾部并淡出"

# === 文案配置 ===
# shop_name / shop_location 完全支持自定义，通过 --vars 传入即可覆盖默认值
# 示例: --vars shop_name="XX造型" shop_location="杭州市西湖区文三路88号"
# 后续可接入 AI 生成文案，当前通过 preset 随机组合过渡
copy:
  variables:
    - name: shop_name
      required: false
      default: "我们店"
      description: "店铺名称（完全自定义，如「XX造型」「锦瑟美发」）"
    - name: shop_location
      required: false
      default: ""
      description: "店铺地址/位置（完全自定义，如「杭州市西湖区文三路88号」，留空则不出现在文案中）"
    - name: style_name
      required: false
      default: "这款发型"
      description: "发型/造型名称"
    - name: feature
      required: false
      default: "洋气又好看"
      description: "发型卖点/特色"

  script_template: |
    {{ opening }}
    {{ detail }}
    {{ shop_name }}{{ recommend }}{{ style_name }}，{{ feature }}。
    {% if shop_location %}我们就在{{ shop_location }}，随时欢迎来坐坐。{% endif %}
    {{ cta }}

  title_template: "{{ shop_name }} · {{ headline }}\n{{ hashtag }}"

  presets:
    headline:
      - "今日发型分享"
      - "发型推荐 · 焕然一新"
      - "造型改变好心情"
      - "她的全新造型"
      - "这款发型绝了"
      - "变美从头开始"
      - "今日造型推荐"
      - "来看看她的新发型"
    hashtag:
      - "#发型推荐 #造型分享 #变美日记"
      - "#今日造型 #发型设计 #焕然一新"
      - "#发型推荐 #美发日记 #造型改变"
      - "#造型推荐 #发型分享 #变美从头开始"
      - "#今日发型 #造型灵感 #发型打卡"
    detail:
      - "从发根到发尾都重新做了调整，整个造型既有层次感又不失柔美。"
      - "特意选了最衬肤色的色调，在自然光下效果特别惊艳，本人比照片还好看。"
      - "根据她的脸型和五官比例做了微调，出来的效果既自然又有辨识度。"
      - "整个过程大概两个小时，从洗剪到最后定型，每一步都很用心。"
      - "做完之后连旁边等位的姐姐都过来问同款，说这个弧度刚刚好。"
      - "她自己说最满意的就是头顶的蓬松度，显得整个人精神了不少。"
      - "这款造型最大的优点就是好打理，平时吹一吹就能出门，省时又好看。"
      - "发色和发型搭配得刚刚好，整个人气质都提升了一个档次。"
    opening:
      - "她说最近心情不太好，想换个造型试试。做完出来那一刻，她对着镜子笑了好久，说这才是自己想要的样子。"
      - "这位姐姐之前一直觉得自己发量少，显得没精神。我帮她做了个蓬松的层次，出来效果她自己都不敢信，说头发好像变多了。"
      - "她跟我说平时太忙了，每天早上根本没时间弄头发。所以我给她设计了个懒人款，洗完吹干就很有型，再也不用早起折腾了。"
      - "本来她只是来修个刘海的，聊着聊着就决定整体换个造型。做完之后她拍了好几张自拍，说朋友圈终于有素材了。"
      - "有位姐妹刷到我之前的视频专门过来的，说就想做同款。做完效果确实也很好看，不同的脸型做出来各有各的韵味。"
      - "她之前在别的地方做过一次不太满意，这次过来让我帮她调整一下。重新修了层次调了弧度，她说终于是自己想要的那个感觉了。"
      - "这位姐姐进店的时候还有点犹豫，怕剪完不好看。结果做完之后笑得停不下来，还给闺蜜打了视频分享。"
      - "她说换了新工作想给自己一个新开始，我就给她推荐了这款比较干练又不失温柔的造型。她说感觉整个人都自信了不少。"
    recommend:
      - "家的发型师特别推荐"
      - "最近主推的就是"
      - "的招牌款就是"
      - "好多老客户都做过"
    cta:
      - "想做同款直接私信我。"
      - "适合什么发型？评论区告诉我。"
      - "私信预约到店有优惠。"
      - "关注我，每天分享最新造型。"
      - "点赞收藏，下次做头发翻出来就行。"
      - "新朋友到店有优惠，私信预约免排队。"

match_rules:
  filename_contains: ["理发", "发型", "造型", "美发", "barber", "hair", "剪发", "烫发", "染发"]
  folder_name: ["理发", "美发", "barber", "hair", "发型"]
  aspect_ratio: portrait
  min_duration: 3
  max_duration: 120
  priority: 15
