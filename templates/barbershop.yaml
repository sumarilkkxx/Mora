# 理发店推荐模板 — 面向女性顾客的发型推荐、造型展示类视频

meta:
  name: "barbershop"
  description: "面向女性顾客的理发店推荐、发型展示、造型变化类短视频"
  version: "1.1"
  author: "AI_clip"
  is_default: true
  tags: ["理发店", "发型", "造型", "美发", "女性"]

extends: _global

canvas:
  width: 1080
  height: 1920
  fps: 30

timeline:
  intro:
    type: title_card
    duration: 0.8
    background: "#1a1a1a"
    text: "{{ headline }}"
    text_style:
      font_size: 60
      color: "#F5DEB3"
      animation: fade_up

  body:
    type: media_sequence
    source: "$input_media"
    duration: auto
    fit_mode: cover_center
    transition:
      type: fade
      duration: 0.5

  outro:
    type: title_card
    duration: 1.0
    text: "{{ cta }}"
    text_style:
      font_size: 46
      color: "#FFFFFF"
      animation: fade

audio:
  voice:
    engine: edge-tts
    voice_id: zh-CN-XiaoxiaoNeural
    rate: "+0%"
    volume: 1.0
  bgm:
    file: "assets/bgm/upbeat_01.mp3"
    volume: 0.4
    ducking:
      enabled: true
      target_volume: 0.15
      fade_duration: 0.3

subtitles:
  source: tts_srt
  style:
    font: "Microsoft YaHei"
    font_size: 24
    color: "#FFFFFF"
    outline_color: "#1a1a1a"
    outline_width: 2
    position: bottom_third
    max_chars_per_line: 16

effects:
  color_grade: high_contrast
  vignette: 0.2

editing:
  techniques:
    - name: loop
      description: "循环播放素材直到填满文案时长"
    - name: freeze_end
      description: "播放完素材后冻结最后一帧直到填满"
    - name: speed_adjust
      description: "微调播放速度使素材恰好填满文案时长（0.75x~1.5x）"
    - name: trim_fade
      description: "素材过长时裁剪尾部并淡出"

# === 文案配置 ===
# shop_name / shop_location 完全支持自定义，通过 --vars 传入即可覆盖默认值
# 示例: --vars shop_name="XX造型" shop_location="杭州市西湖区文三路88号"
# 后续可接入 AI 生成文案，当前通过 preset 随机组合过渡
copy:
  variables:
    - name: shop_name
      required: false
      default: "我们店"
      description: "店铺名称（完全自定义，如「XX造型」「锦瑟美发」）"
    - name: shop_location
      required: false
      default: ""
      description: "店铺地址/位置（完全自定义，如「杭州市西湖区文三路88号」，留空则不出现在文案中）"
    - name: style_name
      required: false
      default: "这款发型"
      description: "发型/造型名称"
    - name: feature
      required: false
      default: "洋气又好看"
      description: "发型卖点/特色"

  script_template: |
    {{ hook }}
    {{ story }}
    {{ shop_name }}{{ recommend }}{{ style_name }}，{{ feature }}。
    {% if shop_location %}我们就在{{ shop_location }}，随时欢迎来坐坐。{% endif %}
    {{ cta }}

  presets:
    hook:
      - "今天这位姐姐的变化，你们一定想看看。"
      - "她说想换个心情，没想到效果这么好。"
      - "做完之后她自己都愣住了，太好看了。"
      - "好多姐妹点名要这款，拍给你们看看效果。"
      - "本来只是想修一下，结果越做越惊喜。"
      - "最近问得最多的发型，就是这个。"
      - "这位姐姐进店的时候还犹豫，做完笑得停不下来。"
    story:
      - "加了点层次和弧度，整个人一下精致了好多。"
      - "特别好打理，随便吹一吹就能出门。"
      - "什么脸型都能驾驭，显脸小还上镜。"
      - "蓬松度上来了，整个人看着轻盈了不少。"
      - "做完她照了半天镜子，说早该来了。"
      - "这个造型网上特别火，好多人拿着视频来找我。"
      - "属于懒人款，不用怎么打理就很好看。"
      - "换了个造型之后，气质一下就不一样了。"
    recommend:
      - "家的发型师特别推荐"
      - "最近主推的就是"
      - "的招牌款就是"
      - "好多老客户都做过"
    cta:
      - "想做同款直接私信我。"
      - "适合什么发型？评论区告诉我。"
      - "私信预约到店有优惠。"
      - "关注我，每天分享最新造型。"
      - "点赞收藏，下次做头发翻出来就行。"
      - "新朋友到店有优惠，私信预约免排队。"

match_rules:
  filename_contains: ["理发", "发型", "造型", "美发", "barber", "hair", "剪发", "烫发", "染发"]
  folder_name: ["理发", "美发", "barber", "hair", "发型"]
  aspect_ratio: portrait
  min_duration: 3
  max_duration: 120
  priority: 15
