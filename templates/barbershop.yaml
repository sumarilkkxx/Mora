# 理发店推荐模板 — 面向女性顾客的发型推荐、造型展示类视频

meta:
  name: "barbershop"
  description: "面向女性顾客的理发店推荐、发型展示、造型变化类短视频"
  version: "1.1"
  author: "AI_clip"
  is_default: true
  tags: ["理发店", "发型", "造型", "美发", "女性"]

extends: _global

canvas:
  width: 1080
  height: 1920
  fps: 30

timeline:
  intro:
    type: title_card
    duration: 0.8
    background: "#1a1a1a"
    text: "{{ headline }}"
    text_style:
      font_size: 60
      color: "#F5DEB3"
      animation: fade_up

  body:
    type: media_sequence
    source: "$input_media"
    duration: auto
    fit_mode: cover_center
    transition:
      type: fade
      duration: 0.5

  outro:
    type: title_card
    duration: 1.0
    text: "{{ cta }}"
    text_style:
      font_size: 46
      color: "#FFFFFF"
      animation: fade

audio:
  voice:
    engine: edge-tts
    voice_id: zh-CN-XiaoxiaoNeural
    rate: "+0%"
    volume: 1.0
  bgm:
    file: "assets/bgm/upbeat_01.mp3"
    volume: 0.4
    ducking:
      enabled: true
      target_volume: 0.15
      fade_duration: 0.3

subtitles:
  source: tts_srt
  style:
    font: "Microsoft YaHei"
    font_size: 68
    color: "#FFFFFF"
    outline_color: "#1a1a1a"
    outline_width: 3.5
    bold: true
    spacing: 1.5
    shadow: 2.5
    margin_v: 90
    margin_h: 50
    alignment: 2
    border_style: 1
    back_alpha: 120
    fade_in: 220
    fade_out: 120

effects:
  color_grade: high_contrast
  vignette: 0.2
  slowdown: 0.8
  ken_burns:
    enabled: true
    zoom_range: 0.08
    drift_speed: 0.15

editing:
  techniques:
    - name: cinematic
      description: "慢放 + 运镜漂移 + 淡入淡出转场（默认首选）"
    - name: speed_adjust
      description: "微调播放速度使素材恰好填满文案时长（0.75x~1.5x）"
    - name: trim_fade
      description: "素材过长时裁剪尾部并淡出"

# === 文案配置 ===
# shop_name / shop_location 完全支持自定义，通过 --vars 传入即可覆盖默认值
# 示例: --vars shop_name="XX造型" shop_location="杭州市西湖区文三路88号"
# 后续可接入 AI 生成文案，当前通过 preset 随机组合过渡
copy:
  variables:
    - name: shop_name
      required: false
      default: "我们店"
      description: "店铺名称（完全自定义，如「XX造型」「锦瑟美发」）"
    - name: shop_location
      required: false
      default: ""
      description: "店铺地址/位置（完全自定义，如「杭州市西湖区文三路88号」，留空则不出现在文案中）"
    - name: style_name
      required: false
      default: "这款发型"
      description: "发型/造型名称"
    - name: feature
      required: false
      default: "洋气又好看"
      description: "发型卖点/特色"

  script_template: |
    {{ opening }}
    {{ shop_name }}{{ recommend }}{{ style_name }}，{{ feature }}。
    {% if shop_location %}我们就在{{ shop_location }}，随时欢迎来坐坐。{% endif %}
    {{ cta }}

  presets:
    opening:
      - "她说最近心情不太好，想换个造型试试。做完出来那一刻，她对着镜子笑了好久，说这才是自己想要的样子。"
      - "这位姐姐之前一直觉得自己发量少，显得没精神。我帮她做了个蓬松的层次，出来效果她自己都不敢信，说头发好像变多了。"
      - "她跟我说平时太忙了，每天早上根本没时间弄头发。所以我给她设计了个懒人款，洗完吹干就很有型，再也不用早起折腾了。"
      - "本来她只是来修个刘海的，聊着聊着就决定整体换个造型。做完之后她拍了好几张自拍，说朋友圈终于有素材了。"
      - "有位姐妹刷到我之前的视频专门过来的，说就想做同款。做完效果确实也很好看，不同的脸型做出来各有各的韵味。"
      - "她之前在别的地方做过一次不太满意，这次过来让我帮她调整一下。重新修了层次调了弧度，她说终于是自己想要的那个感觉了。"
      - "这位姐姐进店的时候还有点犹豫，怕剪完不好看。结果做完之后笑得停不下来，还给闺蜜打了视频分享。"
      - "她说换了新工作想给自己一个新开始，我就给她推荐了这款比较干练又不失温柔的造型。她说感觉整个人都自信了不少。"
    recommend:
      - "家的发型师特别推荐"
      - "最近主推的就是"
      - "的招牌款就是"
      - "好多老客户都做过"
    cta:
      - "想做同款直接私信我。"
      - "适合什么发型？评论区告诉我。"
      - "私信预约到店有优惠。"
      - "关注我，每天分享最新造型。"
      - "点赞收藏，下次做头发翻出来就行。"
      - "新朋友到店有优惠，私信预约免排队。"

match_rules:
  filename_contains: ["理发", "发型", "造型", "美发", "barber", "hair", "剪发", "烫发", "染发"]
  folder_name: ["理发", "美发", "barber", "hair", "发型"]
  aspect_ratio: portrait
  min_duration: 3
  max_duration: 120
  priority: 15
