name: Build and release desktop apps

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main --no-tags

      - name: Require main as the release source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual desktop builds must be started from the main branch."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "The selected commit is not part of the main branch. Merge it into main before building a release."
            exit 1
          fi

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  build:
    name: ${{ matrix.label }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            command: pnpm dist:win
            artifact: Mora-Windows-x64
            files: release/*.exe
            platform: windows
            arch: x64
            report_key: windows-x64
          - label: macOS Apple Silicon
            runner: macos-15
            command: pnpm dist:mac
            artifact: Mora-macOS-arm64
            files: release/*.dmg
            expected_arch: arm64
            platform: macos
            arch: arm64
            report_key: macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            command: pnpm dist:mac
            artifact: Mora-macOS-x64
            files: release/*.dmg
            expected_arch: x86_64
            platform: macos
            arch: x64
            report_key: macos-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and verify bundled media binaries
        run: pnpm media:prepare

      - name: Test desktop delivery contracts
        run: pnpm test:desktop

      - name: Test
        run: pnpm test

      - name: Type-check Electron and Node scripts
        run: pnpm typecheck:js

      - name: Preflight desktop release contract
        id: release_contract
        run: node scripts/desktop-release-report.cjs preflight --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --channel=${{ startsWith(github.ref, 'refs/tags/') && 'official' || 'development' }} --report=test-results/desktop-release-${{ matrix.report_key }}.json
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

      - name: Materialize Apple API key for notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            api_key_path="$RUNNER_TEMP/mora-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          fi

      - name: Build package
        run: ${{ matrix.command }}
        env:
          # Pull requests and manual builds are always unsigned development artifacts. Tagged
          # open-source releases may also be unsigned; complete credentials enable optional signing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.release_contract.outputs.force_code_signing }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_KEYCHAIN: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_KEYCHAIN || '' }}
          APPLE_KEYCHAIN_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_KEYCHAIN_PROFILE || '' }}

      - name: Label signed or unsigned installer
        run: node scripts/label-desktop-artifacts.cjs release ${{ steps.release_contract.outputs.artifact_suffix }}

      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem release -Recurse -Filter Mora.exe |
            Where-Object FullName -Match 'win-unpacked' |
            Select-Object -First 1
          if (-not $app) { throw 'Packaged Mora.exe not found' }
          $env:HEADLESS_SMOKE = '1'
          $smokeArgs = @("--user-data-dir=$env:RUNNER_TEMP\mora-smoke")
          $smoke = Start-Process `
            -FilePath $app.FullName `
            -ArgumentList $smokeArgs `
            -NoNewWindow `
            -PassThru `
            -Wait
          if ($smoke.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($smoke.ExitCode)"
          }

          $installer = Get-ChildItem release -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Mora installer not found' }
          node scripts/desktop-release-report.cjs verify `
            --report=test-results/desktop-release-${{ matrix.report_key }}.json `
            "--artifact=$($installer.FullName)"

      - name: Verify DMG and smoke test installed app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"

          mount_dir="$RUNNER_TEMP/mora-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT

          app_path="$(find "$mount_dir" -maxdepth 2 -type d -name Mora.app -print -quit)"
          test -n "$app_path"
          app_binary="$app_path/Contents/MacOS/Mora"
          file "$app_binary" | grep -q '${{ matrix.expected_arch }}'

          ffmpeg_path="$(find "$app_path/Contents/Resources/standalone/node_modules/ffmpeg-static" -type f -name ffmpeg -print -quit)"
          ffprobe_path="$(find "$app_path/Contents/Resources/standalone/node_modules/@ffprobe-installer" -type f -name ffprobe -print -quit)"
          test -x "$ffmpeg_path"
          test -x "$ffprobe_path"
          "$ffmpeg_path" -version
          "$ffprobe_path" -version

          HEADLESS_SMOKE=1 "$app_binary" --user-data-dir="$RUNNER_TEMP/mora-smoke"

          node scripts/desktop-release-report.cjs verify \
            --report=test-results/desktop-release-${{ matrix.report_key }}.json \
            --artifact="$dmg_path" \
            --app="$app_path"

          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Report installer size
        run: |
          node -e "const fs = require('node:fs'); for (const name of fs.readdirSync('release').filter(n => /\.(exe|dmg)$/.test(n))) console.log(name + ': ' + (fs.statSync('release/' + name).size / 1024 ** 2).toFixed(1) + ' MiB');"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            test-results/desktop-release-${{ matrix.report_key }}.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: Mora-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          node scripts/verify-desktop-release-reports.cjs release-assets

          mapfile -t installers < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print | sort)
          if [[ "${#installers[@]}" -ne 3 ]]; then
            echo "Expected 3 installers, found ${#installers[@]}."
            printf '%s\n' "${installers[@]}"
            exit 1
          fi

          cd release-assets
          sha256sum ./*.exe ./*.dmg > SHA256SUMS.txt

          cat > INSTALLATION-NOTES.md <<'EOF'
          # Mora desktop installation notes

          Mora is an open-source project. Release installers may be unsigned and are labeled
          `-unsigned`; verify the matching SHA-256 value in `SHA256SUMS.txt` before opening them.

          - Windows: Microsoft Defender SmartScreen may show an unknown publisher warning. After
            verifying the checksum, choose **More info → Run anyway** if you trust this GitHub release.
          - macOS: move Mora to Applications, then Control-click Mora and choose **Open**. If macOS
            still blocks it, use **System Settings → Privacy & Security → Open Anyway** after verifying
            the checksum.

          Signed artifacts may be added later as an optional trust improvement; signing is not a
          prerequisite for this project's GitHub releases.
          EOF

      - name: Publish installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Browser-created releases already exist when their tag triggers this workflow.
          # Preserve their release notes and attach the verified installers after all builds pass.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
              --title "Mora ${GITHUB_REF_NAME}"
          fi
