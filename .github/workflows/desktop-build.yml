name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main --no-tags

      - name: Require main as the release source
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual desktop builds must be started from the main branch."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "The selected commit is not part of the main branch. Merge it into main before building a release."
            exit 1
          fi

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  build:
    name: ${{ matrix.label }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            command: pnpm dist:win
            artifact: Mora-Windows-x64
            files: release/*.exe
          - label: macOS Apple Silicon
            runner: macos-15
            command: pnpm dist:mac
            artifact: Mora-macOS-arm64
            files: release/*.dmg
            expected_arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            command: pnpm dist:mac
            artifact: Mora-macOS-x64
            files: release/*.dmg
            expected_arch: x86_64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and verify bundled media binaries
        run: pnpm media:prepare

      - name: Test
        run: pnpm test

      - name: Build package
        run: ${{ matrix.command }}
        env:
          # v0.1.0.0 intentionally ships unsigned: the project does not use paid Apple/Windows
          # signing certificates yet. Passing empty CSC_* values makes electron-builder treat
          # the workspace directory as a certificate path, so signing must be disabled explicitly.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem release -Recurse -Filter Mora.exe |
            Where-Object FullName -Match 'win-unpacked' |
            Select-Object -First 1
          if (-not $app) { throw 'Packaged Mora.exe not found' }
          $env:HEADLESS_SMOKE = '1'
          & $app.FullName --user-data-dir="$env:RUNNER_TEMP\mora-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with exit code $LASTEXITCODE" }

      - name: Verify DMG and smoke test installed app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"

          mount_dir="$RUNNER_TEMP/mora-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT

          app_path="$(find "$mount_dir" -maxdepth 2 -type d -name Mora.app -print -quit)"
          test -n "$app_path"
          app_binary="$app_path/Contents/MacOS/Mora"
          file "$app_binary" | grep -q '${{ matrix.expected_arch }}'

          ffmpeg_path="$(find "$app_path/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static" -type f -name ffmpeg -print -quit)"
          ffprobe_path="$(find "$app_path/Contents/Resources/app.asar.unpacked/node_modules/@ffprobe-installer" -type f -name ffprobe -print -quit)"
          test -x "$ffmpeg_path"
          test -x "$ffprobe_path"
          "$ffmpeg_path" -version
          "$ffprobe_path" -version

          HEADLESS_SMOKE=1 "$app_binary" --user-data-dir="$RUNNER_TEMP/mora-smoke"

          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          pattern: Mora-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          mapfile -t installers < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print | sort)
          if [[ "${#installers[@]}" -ne 3 ]]; then
            echo "Expected 3 installers, found ${#installers[@]}."
            printf '%s\n' "${installers[@]}"
            exit 1
          fi

          cd release-assets
          sha256sum ./*.exe ./*.dmg > SHA256SUMS.txt

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Mora ${GITHUB_REF_NAME}"
