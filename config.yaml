# AI_clip 全局配置

paths:
  templates_dir: "./templates"
  assets_dir: "./assets"
  temp_dir: "./temp"
  reference_videos_dir: "./reference_videos"

ffmpeg:
  video_codec: "libx264"
  audio_codec: "aac"
  preset: "fast"
  crf: 23
  audio_bitrate: "192k"
  movflags: "+faststart"
  # hardware_accel: "h264_nvenc"  # 取消注释以启用 NVIDIA GPU 加速

tts:
  default_voice: "zh-CN-XiaoxiaoNeural"
  default_rate: "+15%"
  max_concurrent: 2
  retry_count: 3
  retry_base_delay: 2.0

batch:
  max_workers: 4
  match_threshold: 30

output:
  default_mode: "ffmpeg"  # ffmpeg / jianying / both
